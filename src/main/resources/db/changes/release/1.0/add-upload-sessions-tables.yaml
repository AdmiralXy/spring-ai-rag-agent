databaseChangeLog:
  - changeSet:
      id: add-upload-sessions-tables
      author: AdmiralXy
      changes:
        - createTable:
            tableName: t_upload_sessions
            columns:
              - column:
                  name: c_id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: c_user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_upload_sessions_users
                    references: t_users(c_id)
                    deleteCascade: true
              - column:
                  name: c_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_chunk_size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: c_status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: c_key_salt
                  type: bytea
                  constraints:
                    nullable: false
              - column:
                  name: c_created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: c_expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - createIndex:
            tableName: t_upload_sessions
            indexName: idx_upload_sessions_expires_at
            columns:
              - column:
                  name: c_expires_at
        - createTable:
            tableName: t_upload_session_files
            columns:
              - column:
                  name: c_session_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: c_index
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: c_path
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: c_chunk_count
                  type: int
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: t_upload_session_files
            columnNames: c_session_id, c_index
            constraintName: pk_upload_session_files
        - addForeignKeyConstraint:
            baseTableName: t_upload_session_files
            baseColumnNames: c_session_id
            referencedTableName: t_upload_sessions
            referencedColumnNames: c_id
            constraintName: fk_upload_session_files_session
            onDelete: CASCADE
