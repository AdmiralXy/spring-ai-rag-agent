databaseChangeLog:
  - changeSet:
      id: add-chat-models-table
      author: AdmiralXy
      comment: Chat models of the users; the built-in model has no user
      changes:
        - createTable:
            tableName: t_chat_models
            columns:
              - column:
                  name: c_id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: c_user_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_chat_models_users
                    references: t_users(c_id)
                    deleteCascade: true
              - column:
                  name: c_builtin
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: c_provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: c_label
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_base_url
                  type: text
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: c_api_key
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_streaming
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: c_system_prompt
                  type: text
              - column:
                  name: c_priority
                  type: int
                  defaultValueNumeric: 100
                  constraints:
                    nullable: false
              - column:
                  name: c_temperature
                  type: double precision
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: c_max_context_tokens
                  type: int
                  defaultValueNumeric: 128000
                  constraints:
                    nullable: false
              - column:
                  name: c_max_output_tokens
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: c_thinking
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: c_vision
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: c_created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: c_updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE t_chat_models ADD CONSTRAINT ck_chat_models_owner CHECK (c_builtin OR c_user_id IS NOT NULL)
        - createIndex:
            tableName: t_chat_models
            indexName: idx_chat_models_user
            columns:
              - column:
                  name: c_user_id
              - column:
                  name: c_priority
              - column:
                  name: c_created_at

  - changeSet:
      id: add-embedding-models-table
      author: AdmiralXy
      changes:
        - createTable:
            tableName: t_embedding_models
            columns:
              - column:
                  name: c_user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    foreignKeyName: fk_embedding_models_users
                    references: t_users(c_id)
                    deleteCascade: true
              - column:
                  name: c_provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: c_base_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_api_key
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_dimensions
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: c_max_document_tokens
                  type: int
                  defaultValueNumeric: 7000
                  constraints:
                    nullable: false
              - column:
                  name: c_updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: add-summarizer-models-table
      author: AdmiralXy
      changes:
        - createTable:
            tableName: t_summarizer_models
            columns:
              - column:
                  name: c_user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    foreignKeyName: fk_summarizer_models_users
                    references: t_users(c_id)
                    deleteCascade: true
              - column:
                  name: c_provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: c_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_base_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_api_key
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_system_prompt
                  type: text
              - column:
                  name: c_updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
