databaseChangeLog:
  - changeSet:
      id: update-documents-indexes
      author: AdmiralXy
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP INDEX IF EXISTS documents_embedding_idx;
              DO $$
              DECLARE
                  dims int;
              BEGIN
                  SELECT atttypmod INTO dims FROM pg_attribute
                  WHERE attrelid = 'documents'::regclass AND attname = 'embedding';
                  IF dims > 0 AND dims <= 2000 THEN
                      EXECUTE 'CREATE INDEX documents_embedding_idx ON documents '
                          || 'USING hnsw (embedding vector_cosine_ops)';
                  END IF;
              END $$;
              CREATE INDEX idx_documents_space ON documents ((metadata ->> 'space'));
              CREATE INDEX idx_documents_doc ON documents ((metadata ->> 'doc'));
              CREATE INDEX idx_documents_content_fts ON documents USING gin (to_tsvector('simple', content));
