databaseChangeLog:
  - changeSet:
      id: update-chat-messages-table
      author: AdmiralXy
      changes:
        - renameColumn:
            tableName: t_chat_messages
            oldColumnName: c_conversation_id
            newColumnName: c_chat_id
        - dropForeignKeyConstraint:
            baseTableName: t_chat_messages
            constraintName: fk_chat_messages_conversations
        - addForeignKeyConstraint:
            baseTableName: t_chat_messages
            baseColumnNames: c_chat_id
            referencedTableName: t_chats
            referencedColumnNames: c_id
            constraintName: fk_chat_messages_chats
            onDelete: CASCADE
        - modifyDataType:
            tableName: t_chat_messages
            columnName: c_role
            newDataType: varchar(16)
        - addNotNullConstraint:
            tableName: t_chat_messages
            columnName: c_role
            columnDataType: varchar(16)
            defaultNullValue: USER
        - addNotNullConstraint:
            tableName: t_chat_messages
            columnName: c_content
            columnDataType: text
            defaultNullValue: ""
        - modifyDataType:
            tableName: t_chat_messages
            columnName: c_created_at
            newDataType: timestamptz
        - addDefaultValue:
            tableName: t_chat_messages
            columnName: c_created_at
            defaultValueComputed: now()
        - addNotNullConstraint:
            tableName: t_chat_messages
            columnName: c_created_at
            columnDataType: timestamptz
            defaultNullValue: now
        - addColumn:
            tableName: t_chat_messages
            columns:
              - column:
                  name: c_parts
                  type: text
              - column:
                  name: c_attachments
                  type: text
              - column:
                  name: c_stats
                  type: text
        - createIndex:
            tableName: t_chat_messages
            indexName: idx_chat_messages_chat_created
            columns:
              - column:
                  name: c_chat_id
              - column:
                  name: c_created_at
