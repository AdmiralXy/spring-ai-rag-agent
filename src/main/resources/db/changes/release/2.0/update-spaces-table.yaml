databaseChangeLog:
  - changeSet:
      id: update-spaces-table
      author: AdmiralXy
      changes:
        - dropColumn:
            tableName: t_spaces
            columnName: c_dimensions
        - addNotNullConstraint:
            tableName: t_spaces
            columnName: c_name
            columnDataType: text
            defaultNullValue: ""
        - modifyDataType:
            tableName: t_spaces
            columnName: c_created_at
            newDataType: timestamptz
        - addDefaultValue:
            tableName: t_spaces
            columnName: c_created_at
            defaultValueComputed: now()
        - addNotNullConstraint:
            tableName: t_spaces
            columnName: c_created_at
            columnDataType: timestamptz
            defaultNullValue: now
