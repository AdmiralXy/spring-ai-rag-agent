databaseChangeLog:
  - changeSet:
      id: add-files-table
      author: AdmiralXy
      changes:
        - createTable:
            tableName: t_files
            columns:
              - column:
                  name: c_id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: c_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_extension
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_content_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: c_size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: c_content
                  type: bytea
                  constraints:
                    nullable: false
              - column:
                  name: c_created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
