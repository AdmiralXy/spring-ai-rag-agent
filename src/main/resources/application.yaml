server:
  port: 8080
  servlet:
    context-path: /api/agent

app:
  outbound:
    insecure-ssl: ${OUTBOUND_INSECURE_SSL:${AI_INSECURE_SSL:false}}
  chat:
    history-limit: 20
    rag:
      percentage: 30
      top-k: 100
  files:
    # Max decoded size for POST /files
    max-size: ${FILES_MAX_SIZE:1000MB}
    # Directory for file bodies stored on disk
    storage-dir: ${FILES_STORAGE_DIR:storage/files}
    uploads:
      chunk-size: ${FILES_UPLOADS_CHUNK_SIZE:50MB}
      max-total-size: ${FILES_UPLOADS_MAX_TOTAL_SIZE:500MB}
      max-files: ${FILES_UPLOADS_MAX_FILES:10000}
      max-batch-chunks: ${FILES_UPLOADS_MAX_BATCH_CHUNKS:1000}
      # Max JSON body for /files/uploads/** requests
      max-request-size: ${FILES_UPLOADS_MAX_REQUEST_SIZE:70MB}
      encryption:
        # The encryption password is the admin password
        kdf-salt: ${FILES_UPLOADS_KDF_SALT:274db9f7fff00700cd90c9b5585b12ad}
        kdf-iterations: ${FILES_UPLOADS_KDF_ITERATIONS:600000}
      # Session expires after this period without chunk uploads.
      ttl: ${FILES_UPLOADS_TTL:PT24H}
      temp-dir: ${FILES_UPLOADS_TEMP_DIR:storage/uploads}
      cleanup-interval: ${FILES_UPLOADS_CLEANUP_INTERVAL:PT15M}
  security:
    admin:
      # Master password
      password: ${ADMIN_PASSWORD:dev}

spring:
  application:
    name: agent
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai}
    username: ${DATABASE_USERNAME:aiuser}
    password: ${DATABASE_PASSWORD:aipass}
  liquibase:
    parameters:
      embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
  jpa:
    open-in-view: false
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      pgvector:
        table-name: documents

springdoc:
  api-docs:
    path: /api-docs
