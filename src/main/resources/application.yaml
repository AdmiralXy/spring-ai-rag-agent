server:
  port: 8080
  servlet:
    context-path: /api/agent

app:
  outbound:
    insecure-ssl: ${OUTBOUND_INSECURE_SSL:${AI_INSECURE_SSL:false}}
  chat:
    history-limit: 20
    rag:
      percentage: ${RAG_PERCENTAGE:30}
      max-tokens: ${RAG_MAX_TOKENS:24000}
      top-k: ${RAG_TOP_K:40}
      keyword-weight: ${RAG_KEYWORD_WEIGHT:0.6}
      expand-top-hits: ${RAG_EXPAND_TOP_HITS:3}
      chunking:
        max-chars: ${RAG_CHUNK_MAX_CHARS:2000}
        max-lines: ${RAG_CHUNK_MAX_LINES:60}
        overlap-lines: ${RAG_CHUNK_OVERLAP_LINES:5}
        overlap-words: ${RAG_CHUNK_OVERLAP_WORDS:40}
  files:
    max-size: ${FILES_MAX_SIZE:1000MB}
    storage-dir: ${FILES_STORAGE_DIR:storage/files}
    uploads:
      chunk-size: ${FILES_UPLOADS_CHUNK_SIZE:50MB}
      max-total-size: ${FILES_UPLOADS_MAX_TOTAL_SIZE:500MB}
      max-files: ${FILES_UPLOADS_MAX_FILES:10000}
      max-batch-chunks: ${FILES_UPLOADS_MAX_BATCH_CHUNKS:1000}
      max-request-size: ${FILES_UPLOADS_MAX_REQUEST_SIZE:70MB}
      encryption:
        kdf-iterations: ${FILES_UPLOADS_KDF_ITERATIONS:600000}
      ttl: ${FILES_UPLOADS_TTL:PT24H}
      temp-dir: ${FILES_UPLOADS_TEMP_DIR:storage/uploads}
      cleanup-interval: ${FILES_UPLOADS_CLEANUP_INTERVAL:PT15M}
  agent-runner:
    url: ${AGENT_RUNNER_URL:http://localhost:8787}
    secret: ${AGENT_RUNNER_SECRET:}
    max-turns: ${AGENT_RUNNER_MAX_TURNS:100}
  security:
    # A sign-in token expires after this much inactivity; every request extends it again
    token-ttl: ${AUTH_TOKEN_TTL:P90D}
    # Turn off to stop new sign-ups (for example on a public server once your account exists)
    registration-enabled: ${REGISTRATION_ENABLED:true}
  # Chat model available to every user; it cannot be edited or deleted
  builtin-model:
    enabled: ${OSS_ENABLED:true}
    label: OSS
    name: ${OSS_MODEL:deepseek-flash}
    base-url: ${OSS_BASE_URL:https://api.deepseek.com}
    api-key: ${OSS_API_KEY:replace-me}
    system-prompt: classpath:prompts/oss-system-prompt.md
    streaming: true
    temperature: 1.0
    max-context-tokens: 128000
    max-output-tokens: 8000
    priority: 1000

spring:
  application:
    name: agent
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai}
    username: ${DATABASE_USERNAME:aiuser}
    password: ${DATABASE_PASSWORD:aipass}
  jpa:
    open-in-view: false
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      decision: none
      audio:
        speech: none
        transcription: none

springdoc:
  api-docs:
    path: /api-docs
